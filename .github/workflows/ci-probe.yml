name: Public Actions probe
on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Confirm runner
        shell: pwsh
        run: |
          Write-Host "GitHub-hosted Windows runner started successfully."
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion

  sdk-pack:
    runs-on: ubuntu-24.04
    steps:
      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Package SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "DOTNET_ROOT=${DOTNET_ROOT}"
          dotnet --info
          tar -C "${DOTNET_ROOT}" -czf "${RUNNER_TEMP}/dotnet-sdk-10.0.302-linux-x64.tar.gz" .
          sha256sum "${RUNNER_TEMP}/dotnet-sdk-10.0.302-linux-x64.tar.gz" > "${RUNNER_TEMP}/dotnet-sdk-10.0.302-linux-x64.tar.gz.sha256"
      - name: Upload SDK package
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.302-linux-x64
          path: |
            ${{ runner.temp }}/dotnet-sdk-10.0.302-linux-x64.tar.gz
            ${{ runner.temp }}/dotnet-sdk-10.0.302-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
