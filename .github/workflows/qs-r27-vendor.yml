name: QS R27 vendor fetch

on:
  push:
    branches: [qs-r27-vendor]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  fetch-vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Ubuntu 18.04 xl2tpd package and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          url='https://archive.ubuntu.com/ubuntu/pool/universe/x/xl2tpd/xl2tpd_1.3.10-1ubuntu1_amd64.deb'
          curl --fail --location --retry 5 --retry-delay 2 --output /tmp/xl2tpd_1.3.10-1ubuntu1_amd64.deb "$url"
          test "$(stat -c %s /tmp/xl2tpd_1.3.10-1ubuntu1_amd64.deb)" -eq 70552
          dpkg-deb --info /tmp/xl2tpd_1.3.10-1ubuntu1_amd64.deb | tee vendor/xl2tpd_1.3.10-1ubuntu1_amd64.info.txt
          sha256sum /tmp/xl2tpd_1.3.10-1ubuntu1_amd64.deb | tee vendor/xl2tpd_1.3.10-1ubuntu1_amd64.deb.sha256
          printf '%s\n' "$url" > vendor/xl2tpd_1.3.10-1ubuntu1_amd64.source-url.txt
      - name: Upload vendor package
        uses: actions/upload-artifact@v4
        with:
          name: qs-r27-xl2tpd-bionic-amd64
          path: |
            /tmp/xl2tpd_1.3.10-1ubuntu1_amd64.deb
            vendor/xl2tpd_1.3.10-1ubuntu1_amd64.info.txt
            vendor/xl2tpd_1.3.10-1ubuntu1_amd64.deb.sha256
            vendor/xl2tpd_1.3.10-1ubuntu1_amd64.source-url.txt
          if-no-files-found: error
          retention-days: 1
