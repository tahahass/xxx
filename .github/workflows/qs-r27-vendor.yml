name: QS R27 vendor fetch

on:
  push:
    branches: [qs-r27-vendor]

permissions:
  contents: write

jobs:
  fetch-vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qs-r27-vendor
      - name: Download Ubuntu 18.04 xl2tpd package and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          url='https://archive.ubuntu.com/ubuntu/pool/universe/x/xl2tpd/xl2tpd_1.3.10-1ubuntu1_amd64.deb'
          curl --fail --location --retry 5 --retry-delay 2 --output /tmp/xl2tpd.deb "$url"
          test "$(stat -c %s /tmp/xl2tpd.deb)" -eq 70552
          dpkg-deb --info /tmp/xl2tpd.deb | tee vendor/xl2tpd_1.3.10-1ubuntu1_amd64.info.txt
          sha256sum /tmp/xl2tpd.deb | tee vendor/xl2tpd_1.3.10-1ubuntu1_amd64.deb.sha256
          base64 -w0 /tmp/xl2tpd.deb > vendor/xl2tpd_1.3.10-1ubuntu1_amd64.deb.b64
          printf '%s\n' "$url" > vendor/xl2tpd_1.3.10-1ubuntu1_amd64.source-url.txt
      - name: Commit fetched vendor package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor
          git commit -m 'Fetch Ubuntu 18.04 xl2tpd package for QS R27'
          git push origin HEAD:qs-r27-vendor
